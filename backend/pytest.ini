[pytest]
testpaths = tests/unit
asyncio_mode = auto
# A stale .pytest_cache owned by another Windows account may be present.
# Keep this suite's cache separate so pytest can always write its own state.
cache_dir = .pytest_cache_current
filterwarnings =
    # Starlette's current TestClient still imports AnyIO's deprecated alias.
    # Remove this when Starlette replaces it with anyio.from_thread.BlockingPortal.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\.testclient
